<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="https://unavatar.io/twitch/akaoutlaw"><link rel="apple-touch-icon" href="https://unavatar.io/twitch/akaoutlaw">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<title>akaoutlaw · Card Prices</title>
<style>
  :root{
    --gold:#ffcb05; --accent:#ffffff; --accent-ink:#000; --accent-soft:#ffffff14; --game:#ffcb05; --game-ink:#121212;
    --tile:rgba(255,255,255,.07); --tile2:rgba(255,255,255,.12); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --text:#fff; --muted:#a99cc0; --green:#3ddc84; --red:#ff2a2a;
    --heavy:'Arial Black','Arial Bold',Gadget,Arial,sans-serif;
    --ui:Archivo,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;font-family:var(--heavy);color:var(--text)}
  button,input,select{font-family:inherit}

  /* ================= CONTROL ROOM ================= */
  html:has(body.control){min-height:100%;background:#1E1A34}
  /* slow-moving purple gradient built around #1E1A34 */
  body.control::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:linear-gradient(125deg,#1E1A34 0%,#2b1f5c 22%,#1E1A34 45%,#3a1d63 68%,#15122a 85%,#1E1A34 100%);
    background-size:300% 300%;animation:bgshift 22s ease-in-out infinite}
  @keyframes bgshift{0%{background-position:0% 30%}50%{background-position:100% 70%}100%{background-position:0% 30%}}
  @media (prefers-reduced-motion:reduce){body.control::before,.glow{animation:none!important}}
  body.control{min-height:100vh;font-family:var(--ui);font-weight:700;font-size:15px;position:relative;overflow-x:hidden}
  body.control.game-op{--game:#ff4d40;--game-ink:#fff}
  body.control ::selection{background:#fff;color:#000}
  /* soft purple glow blobs */
  .glow{position:fixed;border-radius:50%;filter:blur(40px);pointer-events:none;z-index:-1;animation:drift 26s ease-in-out infinite alternate}
  .glow.g2{animation-duration:32s;animation-direction:alternate-reverse}
  .glow.g3{animation-duration:38s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,-40px) scale(1.12)}100%{transform:translate(-60px,50px) scale(.95)}}
  .glow.g1{width:720px;height:720px;left:-220px;top:-200px;background:radial-gradient(circle,rgba(124,58,237,.42),transparent 62%)}
  .glow.g2{width:620px;height:620px;right:-180px;top:30%;background:radial-gradient(circle,rgba(190,40,160,.32),transparent 62%)}
  .glow.g3{width:700px;height:700px;left:30%;bottom:-320px;background:radial-gradient(circle,rgba(70,40,200,.38),transparent 62%)}
  .wrap{max-width:1360px;margin:0 auto;padding:22px 24px 40px}
  /* header */
  header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .backhome{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;text-decoration:none;font-weight:800;font-size:14px;transition:background .15s}
  .backhome:hover{background:rgba(255,255,255,.16)}
  @media(max-width:700px){.backhome span{display:none}}
  .pfpwrap{width:62px;height:62px;flex:0 0 62px}
  .pfp{width:62px;height:62px;border-radius:50%;object-fit:cover;display:block;border:2px solid #fff;background:#1a1426}
  .mark{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:26px;background:#fff;color:#000}
  .bn{font-weight:900;font-size:40px;font-stretch:125%;letter-spacing:-1.2px;line-height:1}
  .bs{font-size:14px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px}
  .ver{font-size:11px;color:var(--muted);background:var(--tile);border-radius:6px;padding:2px 6px}
  .room{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{font-size:13px;color:#fff;display:flex;align-items:center;gap:2px;padding:0 6px}
  .pill b{font-weight:900;margin-left:4px;letter-spacing:.5px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e6b800;margin-right:6px}
  .dot.on{background:var(--green)}
  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--tile);color:#fff;border:0;border-radius:10px;
    padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;transition:background .12s,transform .08s;white-space:nowrap}
  .btn:hover{background:var(--tile2)}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--game);color:var(--game-ink);font-family:var(--heavy);font-weight:900;letter-spacing:.3px}
  .btn.gold:hover{filter:brightness(1.08)}
  .btn.red{background:#2a1416;color:#ffb3b3;box-shadow:inset 0 0 0 1px #5a2429}
  .btn.red:hover{background:#3a1a1e}
  .btn.big{padding:14px 16px;font-size:14px}
  /* segmented controls */
  .viewsw,.tabs{display:flex;gap:6px}
  .tab{padding:12px 16px;border-radius:10px;cursor:pointer;color:#fff;font-weight:800;font-size:15px;border:0;background:var(--tile);transition:background .12s}
  .tab:hover{background:var(--tile2)}
  .tab.on{background:#fff;color:#000}
  /* game switch: logo tiles */
  .gamesw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .gamesw button{min-height:92px;border-radius:14px;border:0;background:var(--tile);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:26px;font-stretch:125%;letter-spacing:-.8px;text-transform:none;transition:background .15s, box-shadow .15s}
  .gamesw button:hover{background:var(--tile2);color:#fff}
  .gamesw button.on{background:var(--tile2);color:#fff;box-shadow:inset 0 0 0 2px #fff}
  .gamesw .glogo{height:66px;max-width:80%;object-fit:contain;display:block;opacity:.4;filter:grayscale(1);transition:opacity .15s, filter .15s, transform .15s}
  .gamesw .glogo + .gtxt{display:none}
  .gamesw button:hover .glogo{opacity:.75;filter:grayscale(.3)}
  .gamesw button.on .glogo{opacity:1;filter:drop-shadow(0 6px 12px #0009);transform:scale(1.04)}
  /* layout */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start}
  @media(max-width:1050px){.grid{grid-template-columns:1fr}}
  .box{background:none;border:0;padding:0;box-shadow:none}
  .boxhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
  .boxhead:has(.sectitle:empty){justify-content:flex-end}
  .sectitle{display:flex;align-items:center;gap:12px}
  .sectitle:empty{display:none}
  .sectitle .seclogo{height:44px;object-fit:contain}
  .sectitle .wm{font-weight:900;font-size:34px;font-stretch:125%;letter-spacing:-1px}
  .sectitle .secsub{font-size:14px;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.nowrap{flex-wrap:nowrap}
  input[type=text],input[type=number],select{background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:700;outline:none;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s}
  input[type=text]::placeholder{color:#7d7193}
  input[type=text]:focus,input[type=number]:focus,select:focus{box-shadow:inset 0 0 0 2px #fff}
  select option{background:#1E1A34}
  .grow{flex:1;min-width:160px}
  .full-w{width:100%}
  /* sets */
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-height:calc(100vh - 300px);overflow:auto;margin-top:14px;padding-right:4px}
  .set{background:var(--tile);border:0;border-radius:14px;padding:16px 10px 14px;cursor:pointer;text-align:center;transition:background .15s,transform .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px}
  .set:hover{background:var(--tile2);transform:translateY(-2px)}
  .set img{height:50px;max-width:100%;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 4px 8px #0008)}
  .set .noimg,.set .code{height:50px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .set .code{font-weight:900;font-size:22px;font-stretch:120%;letter-spacing:-.5px;color:var(--game)}
  .set .noimg{color:var(--muted);font-size:12px}
  .set .n{font-weight:800;font-size:13px;line-height:1.25}
  .set .c{font-size:12px;color:var(--muted);margin-top:4px}
  .set .packwrap{position:relative;height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .set .pack{height:110px;width:auto;max-width:100%;object-fit:contain;opacity:0;transition:opacity .25s, transform .2s;filter:drop-shadow(0 8px 12px #000b)}
  .set .pack.cut{opacity:1}
  .set:hover .pack{transform:translateY(-3px) rotate(-2deg) scale(1.04)}
  .set .pcode{position:absolute;bottom:-6px;right:4px;font-weight:900;font-size:11px;background:#fff;color:#000;border-radius:6px;padding:2px 6px}
  /* card grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-height:calc(100vh - 300px);overflow:auto;margin-top:14px;padding:4px 4px 4px 2px}
  .cardt{cursor:pointer;border-radius:12px;overflow:hidden;background:var(--tile);border:0;transition:transform .15s,box-shadow .15s,background .15s;position:relative}
  .cardt:hover{background:var(--tile2);transform:translateY(-3px)}
  .cardt.sel{box-shadow:inset 0 0 0 2px #fff, 0 10px 24px #0008;background:var(--tile2)}
  .cardt img{width:100%;display:block;aspect-ratio:63/88;object-fit:cover;background:#140b22}
  .cardt .ph{aspect-ratio:63/88;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);padding:8px;text-align:center}
  .cardt .pp{position:absolute;top:7px;right:7px;background:#000c;color:#fff;border-radius:7px;padding:3px 7px;font-size:12px;font-weight:900}
  .cardt .lbl{font-size:12px;font-weight:800;padding:9px 9px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cardt .rr{font-size:11px;color:var(--muted);padding:0 9px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cardt:not(:has(.rr)) .lbl{padding-bottom:9px}
  .crumb{display:flex;gap:10px;align-items:center}
  .crumb img{height:32px}
  .crumb .crumbpack{height:46px;filter:drop-shadow(0 3px 5px #000a)}
  .crumb .setcode{font-weight:900;font-size:15px;background:#fff;color:#000;border-radius:8px;padding:6px 9px}
  .muted{color:var(--muted);font-size:13px}
  .status{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}
  /* card panel (right) */
  .prev{position:sticky;top:20px;max-height:calc(100vh - 130px);overflow:auto;padding-right:4px}
  .prev .hint{display:flex;flex-direction:column;align-items:center;gap:10px;padding:70px 20px;color:var(--muted);text-align:center;background:rgba(0,0,0,.35);border-radius:14px}
  .prev .hint .ghostcard{width:110px;aspect-ratio:63/88;border-radius:10px;background:var(--tile)}
  .pv-img{background:#000;border-radius:14px;padding:18px 0}
  .pv-img img{width:100%;max-width:220px;display:block;margin:0 auto;border-radius:10px;box-shadow:0 14px 34px #000c}
  .pv-head{margin:16px 0 14px}
  .pv-set{font-size:13px;color:var(--muted)}
  .pv-head h2{margin:4px 0 10px;font-weight:900;font-size:30px;font-stretch:115%;letter-spacing:-.9px;line-height:1.05}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px;background:var(--tile2);color:#fff}
  .chip.ghost{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
  .pv-prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pbox{background:var(--tile);border-radius:12px;padding:12px 14px}
  .pbox .k{font-size:13px;color:var(--muted);font-weight:700}
  .pbox .v{font-weight:900;font-size:30px;font-stretch:115%;letter-spacing:-1px;margin-top:2px}
  .pbox.unset .v{font-size:16px;color:var(--muted);font-weight:800;font-stretch:100%;letter-spacing:0;padding:8px 0 6px}
  .pv-upd{font-size:12px;color:var(--muted);margin-top:8px}
  .empty{background:#ff2a2a1f;color:#ffb3b3;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
  .pv-sec{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .lbl2{font-size:14px;color:#fff;font-weight:700;margin-bottom:8px}
  .seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .seg2 button{border:0;background:var(--tile);color:#fff;padding:12px 6px;border-radius:10px;cursor:pointer;font-weight:800;font-size:13px}
  .seg2 button.on{background:#fff;color:#000}
  .seg2 button:disabled{opacity:.3;cursor:not-allowed}
  .vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .var{padding:9px 12px;border-radius:10px;background:var(--tile);cursor:pointer;font-size:13px;font-weight:800}
  .var.on{background:#fff;color:#000}
  .money{flex:1;display:flex;align-items:center;background:rgba(0,0,0,.45);border-radius:10px;padding-left:14px;box-shadow:inset 0 0 0 1px var(--line)}
  .money:focus-within{box-shadow:inset 0 0 0 2px #fff}
  .money span{color:var(--muted);font-weight:900}
  .money input{border:0!important;box-shadow:none!important;background:none!important;width:100%;font-weight:900}
  .tiny{display:inline-block;font-size:12px;color:var(--muted);margin-top:8px}
  .tiny:hover{color:#fff}
  .pv-more{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .pv-more summary{cursor:pointer;font-size:14px;color:var(--muted)}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
  .chk input[type=number]{width:90px;padding:8px 10px;margin-left:auto}
  .actions{display:flex;gap:8px;margin-top:18px;position:sticky;bottom:0;padding:14px 0 2px;background:linear-gradient(180deg,transparent,#1E1A34 30%)}
  .actions .btn:first-child{flex:1}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#fff;color:#000;padding:12px 18px;border-radius:12px;transition:.25s;z-index:99;font-weight:800;box-shadow:0 12px 30px #000a}
  .toast.show{transform:translateX(-50%) translateY(0)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ================= OVERLAY ================= */
  @font-face{font-family:'Pokemon Solid';src:local('Pokemon Solid'),local('PokemonSolid'),local('Pokemon Solid Normal'),url('pokemon-solid.ttf') format('truetype'),url('Pokemon%20Solid.ttf') format('truetype'),url('PokemonSolid.ttf') format('truetype'),url('Pokemon_Solid.ttf') format('truetype');font-display:block}
  body.overlay{background:transparent;overflow:hidden;width:100vw;height:100vh;margin:0}
  /* every look setting is a CSS variable the Overlay Editor controls */
  .ov{--card-w:300px;--lab:26px;--val:58px;--o-lab:2px;--o-val:4.5px;--txt:#fff;--ink:#000;--border:#fff;--panel:#16161a;
      --gap:0px;--edge:60px;--line:6px;
      position:absolute;left:var(--edge);bottom:var(--edge);display:flex;align-items:center}
  .ov.pos-br{left:auto;right:var(--edge)}
  .ov.pos-tl{bottom:auto;top:var(--edge)}
  .ov.pos-tr{bottom:auto;top:var(--edge);left:auto;right:var(--edge)}
  /* card: pops in first, leaves last */
  .ov-card{width:var(--card-w);position:relative;z-index:2;filter:drop-shadow(0 10px 14px #0009);
      will-change:transform,opacity;backface-visibility:hidden;
      opacity:0;transform:translateY(24px) scale(.95);
      transition:opacity .3s ease .4s, transform .4s cubic-bezier(.4,0,1,1) .4s}
  .ov.show .ov-card{opacity:1;transform:none;transition:opacity .4s ease, transform .55s cubic-bezier(.22,1,.36,1)}
  .ov-card img{width:100%;display:block;border-radius:calc(var(--card-w) * .047)}
  .ov-card .shine{position:absolute;inset:0;border-radius:calc(var(--card-w) * .047);overflow:hidden;pointer-events:none}
  .ov-card .shine::after{content:"";position:absolute;top:-50%;left:-80%;width:50%;height:200%;
      background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:rotate(12deg);animation:shine 4.5s ease-in-out infinite}
  .ov.noshine .ov-card .shine{display:none}
  @keyframes shine{0%,55%{left:-80%}100%{left:160%}}
  /* prices: slide out from behind the card */
  .ov-slot{margin-left:-30px;overflow:hidden;padding:60px 70px 70px 0;margin-right:-70px;position:relative;z-index:1}
  .ov-panel{padding:22px 34px 22px calc(56px + var(--gap));border-radius:0 18px 18px 0;
      background:var(--panel);border:4px solid var(--border);border-left:none;
      box-shadow:0 0 0 3px var(--ink), 0 20px 45px #000c;will-change:transform;backface-visibility:hidden;
      transform:translate3d(-101%,0,0);transition:transform .4s cubic-bezier(.55,0,.75,.2)}
  .ov.show .ov-panel{transform:translate3d(0,0,0);transition:transform .65s cubic-bezier(.22,1,.36,1) .35s}
  /* layout: pop UNDER the card */
  .ov.lay-under{flex-direction:column;align-items:center}
  .ov.lay-under .ov-card{filter:drop-shadow(0 3px 5px #0009)}
  .ov.lay-under .ov-slot{margin:-30px -70px 0;padding:0 70px 70px}
  .ov.lay-under .ov-panel{border-radius:0 0 18px 18px;border:4px solid var(--border);border-top:none;
      padding:calc(46px + var(--gap)) 30px 18px;min-width:calc(var(--card-w) - 20px);text-align:center;transform:translate3d(0,-101%,0)}
  .ov.lay-under.show .ov-panel{transform:translate3d(0,0,0)}
  .ov.lay-under .ov-price{align-items:center}
  /* no background: just the outlined text */
  .ov.nobg .ov-panel{background:none;border:none;box-shadow:none}
  .ov.nobg .ov-price + .ov-price{border-top:none}
  .ov-price{display:flex;flex-direction:column;gap:var(--line);padding:10px 0}
  .ov-price + .ov-price{border-top:3px solid #ffffff33}
  /* smooth 16-direction outline (same style as the garage sale counter) */
  .ov-price .lab,.ov-price .val{text-shadow:calc(var(--o) * 1.0) calc(var(--o) * 0.0) 0 var(--ink),calc(var(--o) * 0.924) calc(var(--o) * 0.383) 0 var(--ink),calc(var(--o) * 0.707) calc(var(--o) * 0.707) 0 var(--ink),calc(var(--o) * 0.383) calc(var(--o) * 0.924) 0 var(--ink),calc(var(--o) * 0.0) calc(var(--o) * 1.0) 0 var(--ink),calc(var(--o) * -0.383) calc(var(--o) * 0.924) 0 var(--ink),calc(var(--o) * -0.707) calc(var(--o) * 0.707) 0 var(--ink),calc(var(--o) * -0.924) calc(var(--o) * 0.383) 0 var(--ink),calc(var(--o) * -1.0) calc(var(--o) * 0.0) 0 var(--ink),calc(var(--o) * -0.924) calc(var(--o) * -0.383) 0 var(--ink),calc(var(--o) * -0.707) calc(var(--o) * -0.707) 0 var(--ink),calc(var(--o) * -0.383) calc(var(--o) * -0.924) 0 var(--ink),calc(var(--o) * -0.0) calc(var(--o) * -1.0) 0 var(--ink),calc(var(--o) * 0.383) calc(var(--o) * -0.924) 0 var(--ink),calc(var(--o) * 0.707) calc(var(--o) * -0.707) 0 var(--ink),calc(var(--o) * 0.924) calc(var(--o) * -0.383) 0 var(--ink)}
  .ov-price .lab{font-size:var(--lab);--o:var(--o-lab);font-weight:900;color:var(--txt);letter-spacing:2px;text-transform:uppercase;line-height:1.1}
  .ov.noupper .ov-price .lab{text-transform:none}
  .ov-price .val{font-size:var(--val);--o:var(--o-val);font-weight:900;color:var(--txt);line-height:1;font-variant-numeric:tabular-nums}
  /* font setting */
  .ov.font-poke .ov-price .lab,.ov.font-pokeall .ov-price .lab{font-family:'Pokemon Solid','Arial Black',sans-serif;font-weight:400;text-transform:none;letter-spacing:2px}
  .ov.font-pokeall .ov-price .val{font-family:'Pokemon Solid','Arial Black',sans-serif;font-weight:400;letter-spacing:2px}
  .ov.font-impact .ov-price .lab,.ov.font-impact .ov-price .val{font-family:Impact,'Arial Black',sans-serif;font-weight:400;letter-spacing:1px}
  .ov.font-verdana .ov-price .lab,.ov.font-verdana .ov-price .val{font-family:Verdana,'Arial Black',sans-serif;font-weight:900}

  /* ================= OVERLAY EDITOR ================= */
  .ed{display:grid;grid-template-columns:1fr 380px;gap:18px}
  @media(max-width:1100px){.ed{grid-template-columns:1fr}}
  .ed-stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden}
  .ed-stage iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;background:transparent}
  .ed-stage.bg-dark{background:#222}
  .ed-stage.bg-green{background:#2f9e55}
  .ed-stage.bg-check{background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/32px 32px}
  .ed-stage.bg-light{background:#cfcfd6}
  .ed-ctrl{max-height:78vh;overflow:auto;padding-right:4px}
  .ed-ctrl h3{margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:#fff;font-weight:800}
  .ed-ctrl h3:first-child{margin-top:0;padding-top:0;border-top:0}
  .fld{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
  .fld input[type=range]{width:100%;accent-color:#fff}
  .fld .num{text-align:right;color:var(--muted);font-size:12px}
  .fld.two{grid-template-columns:110px 1fr}
  .fld input[type=color]{width:44px;height:30px;border:1px solid #33333d;border-radius:8px;background:#0b0b0e;padding:2px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{background:var(--tile);border:0;color:#fff;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:800;cursor:pointer}
  .seg button.on{background:#fff;color:#000}
  .viewsw{display:flex;gap:6px}
</style>
</head>
<body>
<script>
/* =========================================================
   akaoutlaw · Pokémon card prices — control room + overlay
   Data: TCGdex (api.tcgdex.net) — free, no key, TCGplayer + Cardmarket prices
   Sync: same-browser (BroadcastChannel/localStorage, e.g. OBS dock)
         + ntfy.sh relay keyed by your room code (works across devices)
   Overlay URL:  this-page.html?overlay=1&key=YOURKEY
   ========================================================= */
const API = 'https://api.tcgdex.net/v2/en';
const P = new URLSearchParams(location.search);
const IS_OVERLAY = P.has('overlay');
const ROOM = (P.get('key') || P.get('room') || localStorage.getItem('pkmn_room') || makeRoom()).toUpperCase();
localStorage.setItem('pkmn_room', ROOM);
const TOPIC = 'akaoutlaw-pkmn-' + ROOM;
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('pkmn-' + ROOM) : null;

function makeRoom(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cache = {};
async function api(path){
  if(cache[path]) return cache[path];
  const r = await fetch(API + path);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return cache[path] = await r.json();
}
const img = (base, q='high', ext='webp') => !base ? '' : /\.(jpe?g|png|webp|gif)(\?|$)/i.test(base) ? base : `${base}/${q}.${ext}`;

/* ---------- One Piece (OPTCG API — free, no key, TCGplayer prices) ---------- */
const OP_API = 'https://optcgapi.com/api';
const OP_RAR = {L:'Leader',C:'Common',UC:'Uncommon',R:'Rare',SR:'Super Rare',SEC:'Secret Rare',SP:'SP Card','SP CARD':'SP Card',TR:'Treasure Rare',P:'Promo',PR:'Promo'};
const opCache = {};
// TCGplayer product photos of each One Piece booster pack / starter deck (keyed by set code without dashes)
const OP_PACK = Object.fromEntries('ST37:735362,EB06:733408,ST38:735364,OP17:704756,OP18:712904,EB05:711383,ST31:704885,ST34:704893,ST33:704890,ST32:704889,ST35:704894,ST36:704897,OP16:689341,ST30:692138,EB03:666727,ST29:671479,OP15EB04:682056,OP14EB04:666577,OP13:628351,ST22:628448,PRB02:628451,OP12:628345,OP11:620179,ST23:627669,ST24:627672,ST25:627674,ST26:627677,ST28:627681,ST27:627678,OP10:586670,ST21:606575,EB02:594068,OP09:563833,PRB01:545398,ST18:545042,ST15:545033,ST16:545036,ST17:545039,ST19:545045,ST20:545048,ST14:545026,OP08:542502,OP07:532104,EB01:521160,ST12:536585,ST13:543595,ST11:515294,OP06:515077,ST10:502982,OP05:498733,OP04:485832,ST08:502975,OP03:477175,ST09:502978,ST07:480236,ST06:455868,ST05:455859,OP02:455865,OP01:450085,ST01:288221,ST02:288226,ST04:288224,ST03:288227'.split(',').map(x=>x.split(':')));
// cuts the white photo background off a pack image (only white touching the edges), returns a transparent image URL
const cutCache = {};
function cutoutWhite(src){
  if(cutCache[src]) return cutCache[src];
  return cutCache[src] = new Promise(res=>{
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = ()=>{ try{
      const w=im.naturalWidth, h=im.naturalHeight, c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(im,0,0);
      const id=x.getImageData(0,0,w,h), d=id.data, seen=new Uint8Array(w*h), st=[];
      const isW = p => d[p*4]>228 && d[p*4+1]>228 && d[p*4+2]>228;
      for(let X=0;X<w;X++) st.push(X,(h-1)*w+X);
      for(let Y=0;Y<h;Y++) st.push(Y*w,Y*w+w-1);
      while(st.length){ const p=st.pop(); if(seen[p] || !isW(p)) continue; seen[p]=1; d[p*4+3]=0;
        const X=p%w; if(X>0) st.push(p-1); if(X<w-1) st.push(p+1); if(p>=w) st.push(p-w); if(p<w*(h-1)) st.push(p+w); }
      // soften the light fringe left next to the removed area
      let x0=w,y0=h,x1=0,y1=0;
      for(let Y=0;Y<h;Y++) for(let X=0;X<w;X++){ const p=Y*w+X; if(seen[p]) continue;
        const nb=(X>0&&seen[p-1])||(X<w-1&&seen[p+1])||(Y>0&&seen[p-w])||(Y<h-1&&seen[p+w]);
        if(nb && d[p*4]>190 && d[p*4+1]>190 && d[p*4+2]>190) d[p*4+3]=110;
        if(X<x0)x0=X; if(X>x1)x1=X; if(Y<y0)y0=Y; if(Y>y1)y1=Y; }
      x.putImageData(id,0,0);
      if(x1<=x0||y1<=y0) return res(src);
      const c2=document.createElement('canvas'); c2.width=x1-x0+1; c2.height=y1-y0+1;
      c2.getContext('2d').drawImage(c,x0,y0,c2.width,c2.height,0,0,c2.width,c2.height);
      res(c2.toDataURL('image/webp',0.92));
    }catch(e){ res(src); } };
    im.onerror = ()=>res(src);
    im.src = src;
  });
}
function cutPacks(root){
  root.querySelectorAll('img.pack,img.crumbpack').forEach(img=>{
    if(img.dataset.cut) return; img.dataset.cut='1';
    cutoutWhite(img.getAttribute('src')).then(u=>{ img.src=u; img.classList.add('cut'); });
  });
}
const opPackImg = code => { const id = OP_PACK[String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'')]; return id ? `https://tcgplayer-cdn.tcgplayer.com/product/${id}_in_400x400.jpg?cors=1` : ''; };   // ?cors=1 keeps it separate from any non-CORS cached copy
async function opFetch(path){
  const k='op'+path; if(cache[k]) return cache[k];
  const r = await fetch(OP_API + path); if(!r.ok) throw new Error('HTTP '+r.status);
  return cache[k] = await r.json();
}
function opTags(name){
  const t=[]; if(/manga/i.test(name)) t.push('Manga');
  if(/alternate art/i.test(name)) t.push('Alt Art'); else if(/parallel/i.test(name)) t.push('Parallel');
  if(/reprint/i.test(name)) t.push('Reprint'); if(/serial/i.test(name)) t.push('Serial');
  return t;
}
// turns an OPTCG card into the same shape the rest of the app already uses
function opNorm(c){
  const id = 'op:' + (c.card_image_id || c.card_set_id);
  if(opCache[id]) return opCache[id];
  const code = String(c.rarity||'').toUpperCase(), tags = opTags(c.card_name||'');
  return opCache[id] = {game:'op', id, name:c.card_name, cleanName:String(c.card_name||'').replace(/\s*\([^)]*\)/g,'').trim(),
    localId:c.card_set_id, image:c.card_image, rarityCode:code, tags,
    rarity:[OP_RAR[code]||c.rarity, ...tags].filter(Boolean).join(' · '),
    set:{name:c.set_name, id:c.set_id},
    pricing:{tcgplayer:{updated:c.date_scraped, unit:'USD', normal:{marketPrice:c.market_price, lowPrice:c.inventory_price}}}};
}
// one way to load any card, Pokémon (TCGdex) or One Piece (OPTCG)
async function getCard(id){
  id = String(id);
  if(id.startsWith('op:')){
    if(opCache[id]) return opCache[id];
    const base = id.slice(3).split('_')[0];
    const paths = /^ST/i.test(base) ? ['/decks/card/','/sets/card/'] : ['/sets/card/','/decks/card/'];
    for(const pth of paths){
      try{ const list = await opFetch(pth + encodeURIComponent(base) + '/'); const arr = Array.isArray(list)?list:[list];
        arr.forEach(opNorm); if(opCache[id]) return opCache[id]; }catch(_){}
    }
    throw new Error('card not found');
  }
  return api('/cards/' + encodeURIComponent(id));
}

/* ---------- price helpers ---------- */
const VAR_NAMES = {normal:'Normal',holofoil:'Holo',holo:'Holo',reverse:'Reverse Holo','reverse-holofoil':'Reverse Holo',
  '1stEdition':'1st Edition','1st-edition':'1st Edition','1stEditionHolofoil':'1st Ed Holo','unlimited':'Unlimited','unlimitedHolofoil':'Unlimited Holo'};
function varName(k){
  if(!k) return '';
  if(VAR_NAMES[k]) return VAR_NAMES[k];
  return String(k)
    .replace(/([a-z])([A-Z])/g,'$1 $2').replace(/[-_]+/g,' ').toLowerCase()
    .replace(/holofoil/g,'holo').replace(/1st edition/g,'1st ed').replace(/reverse holo/g,'reverse')
    .replace(/\b(\w)/g,c=>c.toUpperCase()).replace('1st Ed','1st Edition').replace(/^Reverse$/,'Reverse Holo');
}
function tcgVariants(card){
  const t = card?.pricing?.tcgplayer; if(!t) return [];
  return Object.keys(t).filter(k=>t[k] && typeof t[k]==='object');
}
function fmt(n, cur){
  if(n==null || isNaN(n)) return '—';
  const sym = cur==='EUR' ? '€' : '$';
  const suf = cur==='CAD' ? ' CAD' : '';
  return sym + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + suf;
}
// Builds what the overlay shows from a card + settings
function buildView(card, s){
  const out = {main:null, mainLabel:'', chips:[], cur:'USD', updated:null, source:''};
  const tcg = card?.pricing?.tcgplayer, cm = card?.pricing?.cardmarket;
  if(s.source==='cardmarket' && cm){
    const h = s.cmHolo ? '-holo' : '';
    out.cur='EUR'; out.source='Cardmarket'; out.updated=cm.updated;
    out.main = cm['trend'+h] ?? cm['avg'+h]; out.mainLabel = 'Trend';
    out.chips = [['Low',cm['low'+h]],['7-day avg',cm['avg7'+h]],['30-day avg',cm['avg30'+h]]];
    out.raw = s.rawFrom==='low' ? cm['low'+h] : s.rawFrom==='mid' ? cm['avg'+h] : out.main;
  } else if(tcg){
    const v = tcg[s.variant] || tcg[tcgVariants(card)[0]];
    if(v){
      out.source='TCGplayer'; out.updated=tcg.updated;
      const rate = s.cad ? (parseFloat(s.rate)||1) : 1;
      out.cur = s.cad ? 'CAD' : 'USD';
      const m = x => x==null ? null : x*rate;
      out.main = m(v.marketPrice ?? v.midPrice); out.mainLabel = 'Market';
      out.chips = [['Low',m(v.lowPrice)],['Mid',m(v.midPrice)],['High',m(v.highPrice)]];
      out.raw = s.rawFrom==='low' ? m(v.lowPrice) : s.rawFrom==='mid' ? m(v.midPrice) : out.main;
    }
  }
  if(s.rawFrom==='custom'){ const n=parseFloat(String(s.rawCustom||'').replace(/[^0-9.]/g,'')); out.raw = isNaN(n)?null:n; }
  return out;
}

/* ---------- overlay look (edited in the Overlay Editor) ---------- */
const STYLE_DEFAULTS = {layout:'under', bg:false, pos:'bl', font:'arial', cardW:300, lab:26, val:58, oLab:2, oVal:4.5,
  txt:'#ffffff', ink:'#000000', border:'#ffffff', panel:'#16161a', gap:0, line:6, edge:60,
  rawLabel:'Raw Price', psaLabel:'PSA 10 Price', upper:true, shine:true, countUp:true};
function styleOf(s){
  const st = Object.assign({}, STYLE_DEFAULTS, s.style||{});
  // carry over older settings saved before the editor existed
  if(!s.style){ if(s.layout) st.layout=s.layout; if(s.bg!==undefined) st.bg=s.bg; if(s.pos) st.pos=s.pos; if(s.font) st.font=s.font; }
  return st;
}
function ovClass(st){
  return 'ov pos-'+st.pos+' lay-'+(st.layout==='under'?'under':'right')+(st.bg?'':' nobg')+
    ({poke:' font-poke',pokeall:' font-pokeall',impact:' font-impact',verdana:' font-verdana'}[st.font]||'')+
    (st.upper?'':' noupper')+(st.shine?'':' noshine');
}
function applyStyle(el, st){
  const v={'--card-w':st.cardW+'px','--lab':st.lab+'px','--val':st.val+'px','--o-lab':st.oLab+'px','--o-val':st.oVal+'px',
    '--txt':st.txt,'--ink':st.ink,'--border':st.border,'--panel':st.panel,'--gap':st.gap+'px','--line':st.line+'px','--edge':st.edge+'px'};
  for(const k in v) el.style.setProperty(k, v[k]);
}

/* =========================================================
   OVERLAY
   ========================================================= */
if(IS_OVERLAY){
  document.body.className='overlay';
  document.body.innerHTML = `<div class="ov" id="ov"></div>`;
  const ov = $('#ov');
  const PREVIEW = P.has('preview');
  let lastTs = 0, renderToken = 0, shownSig = '';

  async function render(state, force){
    if(!state) return;
    if(!force){ if(!state.ts || state.ts <= lastTs) return; }   // ignore duplicates/older (same click arrives via several channels)
    lastTs = Math.max(lastTs, state.ts||0);
    const s0 = state.settings || {}, st = styleOf(s0);
    // look-only change on the card already showing: restyle in place, no replay
    if(!force && state.visible && state.cardId && ov.classList.contains('show')){
      try{
        const c = await getCard(state.cardId); const vv = buildView(c, s0);
        const sig = [state.cardId, state.psa10, vv.raw, vv.cur].join('|');
        if(sig === shownSig){
          ++renderToken;
          ov.className = ovClass(st) + ' show'; applyStyle(ov, st);
          const labs = ov.querySelectorAll('.lab'); if(labs[0]) labs[0].textContent = st.rawLabel; if(labs[1]) labs[1].textContent = st.psaLabel;
          ov.querySelectorAll('.val').forEach(el=>{ if(el.dataset.n!=='') el.textContent=fmt(parseFloat(el.dataset.n), el.dataset.c); });
          return;
        }
      }catch(_){}
    }
    const token = ++renderToken;
    if(!state.visible || !state.cardId){ ov.classList.remove('show'); shownSig=''; return; }  // token already bumped above
    let card;
    try{ card = await getCard(state.cardId); }catch(e){ return; }
    if(token !== renderToken) return;
    const s = state.settings || {};
    const v = buildView(card, s);
    const varLabel = s.source==='cardmarket' ? (s.cmHolo?'Holo':'') : varName(s.variant);
    const html = `
      <div class="ov-card"><img src="${esc(img(card.image))}" onerror="this.src='${esc(img(card.image,'high','png'))}'"><div class="shine"></div></div>
      <div class="ov-slot"><div class="ov-panel">
        <div class="ov-price"><span class="lab">${esc(st.rawLabel)}</span><span class="val" data-n="${v.raw??''}" data-c="${v.cur}">${fmt(v.raw,v.cur)}</span></div>
        ${state.psa10!=null?`<div class="ov-price"><span class="lab">${esc(st.psaLabel)}</span><span class="val" data-n="${state.psa10??''}" data-c="USD">${fmt(state.psa10,'USD')}</span></div>`:''}
      </div>      </div>`;
    const pos = ovClass(st);
    const sig = [state.cardId, state.psa10, v.raw, v.cur].join('|');
    if(st.font==='poke'||st.font==='pokeall'){ try{ await Promise.race([document.fonts.load("30px 'Pokemon Solid'"), new Promise(r=>setTimeout(r,1500))]); }catch(_){} }
    // preload the card image BEFORE touching the screen, so nothing pops in half-loaded
    await new Promise(r=>{ const pre=new Image(); pre.onload=pre.onerror=r; pre.src=img(card.image); setTimeout(r,3000); });
    if(token !== renderToken) return;
    if(ov.classList.contains('show')){
      ov.classList.remove('show');
      await new Promise(r=>setTimeout(r,900));
      if(token !== renderToken) return;
    }
    ov.className = pos; applyStyle(ov, st); ov.innerHTML = html; shownSig = sig;
    if(st.countUp) ov.querySelectorAll('.val').forEach(el=>{ if(el.dataset.n!=='') el.textContent=fmt(0,el.dataset.c); });
    requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('show')));
    // count the prices up as the plaque slides out
    if(st.countUp) setTimeout(()=>{ if(token !== renderToken) return; ov.querySelectorAll('.val').forEach(el=>{
      const target=parseFloat(el.dataset.n); if(isNaN(target)) return;
      const t0=performance.now(), dur=1000;
      const step=t=>{ if(token !== renderToken) return;
        const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4);
        el.textContent=fmt(target*e, el.dataset.c); if(k<1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }); }, 650);
  }

  if(PREVIEW){
    window.addEventListener('message', e => {
      if(e.origin !== location.origin || !e.data) return;
      if(e.data.type==='state') render(e.data.state, false);
      if(e.data.type==='replay') render(Object.assign({}, e.data.state, {ts: Date.now()}), true);
    });
    parent.postMessage({type:'preview-ready'}, location.origin);
  } else {
  // same-browser channels (OBS custom dock shares storage with browser sources)
  bc && (bc.onmessage = e => render(e.data));
  window.addEventListener('storage', e => { if(e.key==='pkmn_state_'+ROOM && e.newValue) render(JSON.parse(e.newValue)); });
  // cross-device relay
  function connect(){
    const es = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);
    es.onmessage = e => { try{ const m = JSON.parse(e.data); if(m.message) render(JSON.parse(m.message)); }catch(_){} };
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  }
  connect();
  // restore last state on load (OBS scene switch / refresh)
  (async()=>{
    const local = localStorage.getItem('pkmn_state_'+ROOM);
    if(local) render(JSON.parse(local));
    try{
      const r = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1&since=12h`);
      const lines = (await r.text()).trim().split('\n').filter(Boolean);
      const last = lines.length ? JSON.parse(lines[lines.length-1]) : null;
      if(last?.message) render(JSON.parse(last.message));
    }catch(_){}
  })();
  }
}

/* =========================================================
   CONTROL ROOM
   ========================================================= */
else {
  document.body.className='control';
  document.body.innerHTML = `
  <i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i>
  <div class="wrap">
    <header>
      <div class="brand">
        <a class="backhome" href="https://outlawswitchmyshit.com/" title="Back to home">←<span> Home</span></a>
        <div class="pfpwrap"><img class="pfp" alt="akaoutlaw" src="logos/pfp.png"
          onerror="if(!this.dataset.t){this.dataset.t=1;this.src='https://unavatar.io/twitch/akaoutlaw?fallback=false'}else{this.replaceWith(Object.assign(document.createElement('div'),{className:'mark',textContent:'A'}))}"></div>
        <div><div class="bn">akaoutlaw</div><div class="bs">Card Prices <span class="ver">v20</span></div></div>
      </div>
      <div class="viewsw">
        <button class="tab on" data-v="cards">Cards</button>
        <button class="tab" data-v="editor">Overlay Editor</button>
      </div>
      <div class="room">
        <span class="pill" title="Your private key links this control room to your overlay"><span class="dot" id="dot"></span>Key <b>${ROOM}</b></span>
        <button class="btn" id="copyUrl">Copy overlay URL</button>
        <button class="btn" id="newRoom" title="Make a new private key">New key</button>
      </div>
    </header>
    <div class="grid" id="viewCards">
      <div class="box">
        <div class="gamesw gamebar">
          <button data-g="pk" title="Pokémon"><img class="glogo" src="logos/pokemon.png" alt="" onerror="this.remove()"><span class="gtxt">Pokémon</span></button>
          <button data-g="op" title="One Piece"><img class="glogo" src="logos/one-piece.png" alt="" onerror="this.remove()"><span class="gtxt">One Piece</span></button>
        </div>
        <div class="boxhead">
          <div class="sectitle" id="sectitle"></div>
          <div class="tabs">
            <button class="tab on" data-t="sets">Browse sets</button>
            <button class="tab" data-t="search">Search</button>
          </div>
        </div>
        <div id="pane"></div>
      </div>
      <div class="box prev" id="prev"><div class="hint"><div class="ghostcard"></div><b style="color:var(--text)">No card picked</b>Pick a set, then click a card to see its prices.</div></div>
    </div>
    <div class="ed" id="viewEditor" style="display:none"></div>
  </div>
  <div class="toast" id="toast"></div>`;

  const S = JSON.parse(localStorage.getItem('pkmn_settings')||'null') || {
    source:'tcgplayer', variant:'', cmHolo:false, cad:false, rate:'1.40', showChips:true, showSource:true, pos:'bl', note:''
  };
  const saveS = ()=>localStorage.setItem('pkmn_settings', JSON.stringify(S));
  // PSA 10 prices: remembered per card (typed in, or fetched with a PokemonPriceTracker key)
  const psaMap = JSON.parse(localStorage.getItem('pkmn_psa10')||'{}');
  const savePsa = ()=>localStorage.setItem('pkmn_psa10', JSON.stringify(psaMap));
  const PPT_KEY = () => localStorage.getItem('pkmn_ppt_key') || '';
  // Looks through a PokemonPriceTracker card response for a PSA 10 price (field names vary by plan/version)
  function findPsa10(obj){
    let found=null;
    const walk=(o,depth,inPsa)=>{
      if(!o || typeof o!=='object' || depth>7 || found!=null) return;
      for(const [k,v] of Object.entries(o)){
        const isPsa = /^(psa[_\s-]?10|PSA_10|grade[_\s-]?10)$/i.test(k) || /psa\s?10/i.test(k);
        if(isPsa || inPsa){
          if(typeof v==='number' && v>0 && (inPsa ? /avg|average|market|smart|median|price/i.test(k) : true)){ found=v; return; }
          if(typeof v==='object') walk(v,depth+1,true);
        } else if(typeof v==='object') walk(v,depth+1,false);
        if(found!=null) return;
      }
    };
    walk(obj,0,false);
    return found;
  }
  async function fetchPsa10(card){
    const key=PPT_KEY(); if(!key) throw new Error('no key');
    const q = new URLSearchParams({search: card.name, includeEbay:'true', limit:'20'});
    if(card.set?.name) q.set('set', card.set.name);
    const r = await fetch('https://www.pokemonpricetracker.com/api/v2/cards?'+q, {headers:{Authorization:'Bearer '+key}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    const list = Array.isArray(j) ? j : (Array.isArray(j.data) ? j.data : [j.data||j]);
    const num = String(card.localId).replace(/^0+/,'');
    const match = list.find(c=>String(c.cardNumber??c.number??c.localId??'').split('/')[0].replace(/^0+/,'')===num) || list[0];
    const v = match ? findPsa10(match) : null;
    if(v==null) throw new Error('no PSA 10 data for this card');
    return v;
  }

  /* ---- rarity + price helpers for sorting ---- */
  // Ranked to follow the official rarity tiers (lowest → highest)
  function rarityScore(r){
    r=String(r||'').toLowerCase();
    if(!r) return 0;
    if(/mega hyper|hyper|crown|rainbow|gold/.test(r)) return 12;
    if(/special illustration/.test(r)) return 11;
    if(/secret/.test(r)) return 10;
    if(/shiny ultra/.test(r)) return 9;
    if(/illustration/.test(r)) return 8;
    if(/ultra/.test(r)) return 7;
    if(/shiny|amazing|radiant|ace spec|legend|prime|lv\.?x|star/.test(r)) return 6;
    if(/double|holo.*(v|ex|gx|vmax|vstar)|break/.test(r)) return 5;
    if(/holo/.test(r)) return 4;
    if(/uncommon/.test(r)) return 2;
    if(/common/.test(r)) return 1;
    if(/rare/.test(r)) return 3;
    return 0;
  }
  function rarityOf(card){
    if(card?.game==='op'){
      const b = {C:1,UC:2,R:3,P:3,L:4,SR:5,SP:8,'SP CARD':8,SEC:9,TR:10}[card.rarityCode]||0;
      return b + (card.tags.includes('Manga') ? 6 : (card.tags.includes('Alt Art')||card.tags.includes('Parallel')) ? 3 : 0);
    }
    return rarityScore(card?.rarity);
  }
  function bestPrice(card){
    const t=card?.pricing?.tcgplayer; let m=null;
    if(t) for(const k of tcgVariants(card)){ const p=t[k].marketPrice ?? t[k].midPrice; if(p!=null && (m==null||p>m)) m=p; }
    if(m==null && card?.pricing?.cardmarket) m = card.pricing.cardmarket.trend ?? card.pricing.cardmarket.avg ?? null;
    return m;
  }
  async function loadDetails(cards, onProgress){
    let i=0, done=0; const out={};
    const worker = async()=>{ while(i<cards.length){ const c=cards[i++];
      try{ out[c.id]=await getCard(c.id); }catch(_){}
      onProgress && onProgress(++done, cards.length); } };
    await Promise.all(Array.from({length:8}, worker));
    return out;
  }
  const numKey = c => { const n=parseInt(String(c.localId).split('-').pop(),10); return isNaN(n) ? 1e9 : n + (c.tags ? c.tags.length/10 : 0); };

  }

    $('#oCad').onchange=e=>{S.cad=e.target.checked; saveS(); renderPrev()};
    $('#oRate').onchange=e=>{S.rate=e.target.value; saveS(); renderPrev()};
    $('#show').onclick=()=>{visible=true; send(); $('#show').textContent='↻ Update overlay'; toast('Sent to overlay')};
    $('#hide').onclick=()=>{visible=false; send(); $('#show').textContent='▶ Show on overlay'; toast('Overlay hidden')};
  }


  /* =================== OVERLAY EDITOR =================== */
  const ST = styleOf(S); S.style = ST; saveS();
  let edBuilt=false, edReady=false, edLive = localStorage.getItem('pkmn_ed_live')==='1';
  const DEMO = {pk:'base1-4', op:'op:OP01-120_p2'};   // Base Set Charizard / Shanks manga — used when no card is picked
  const DEMO_ID_ = () => DEMO[S.game==='op'?'op':'pk'];
  const edFrame = ()=>$('#edFrame');
  const edState = (force)=>({cardId: current?.id || DEMO_ID_(), visible:true, settings:{...S, style:{...ST}},
      psa10: current ? (psaMap[current.id] ?? 4250) : 4250, ts: Date.now()});
  const edPost = (type)=>{ const f=edFrame(); if(f && edReady) f.contentWindow.postMessage({type, state: edState()}, location.origin); };
  let liveT=null;
  const changed = ()=>{
    saveS(); edPost('state');
    if(edLive && visible){ clearTimeout(liveT); liveT=setTimeout(send, 250); }
  };
  window.addEventListener('message', e=>{ if(e.origin===location.origin && e.data?.type==='preview-ready'){ edReady=true; edPost('replay'); } });

  function edScale(){
    const st=$('#edStage'); if(!st) return;
    const k = st.clientWidth/1920; edFrame().style.transform=`scale(${k})`;
  }
  window.addEventListener('resize', edScale);

  const SLIDERS = [
    ['Sizes'],
    ['cardW','Card size',150,520,1,'px'],
    ['lab','Title size',10,60,1,'px'],
    ['val','Price size',20,120,1,'px'],
    ['Outline'],
    ['oLab','Title outline',0,8,0.5,'px'],
    ['oVal','Price outline',0,12,0.5,'px'],
    ['Spacing'],
    ['gap','Card ↔ prices',-20,80,1,'px'],
    ['line','Title ↔ price',-10,30,1,'px'],
    ['edge','Screen edge',0,300,5,'px'],
  ];
  const seg = (key, opts) => `<div class="seg" data-k="${key}">${opts.map(([v,n])=>`<button data-v="${v}" class="${String(ST[key])===String(v)?'on':''}">${n}</button>`).join('')}</div>`;

  function buildEditor(){
    const v=$('#viewEditor');
    v.innerHTML = `
      <div class="box">
        <div class="row" style="margin-bottom:10px">
          <b>Live preview</b><span class="muted">${current?esc(current.name):'demo card — pick a card in Cards to preview it'}</span>
          <div class="seg" id="edBg" style="margin-left:auto">
            ${[['check','Checker'],['dark','Dark'],['green','Green'],['light','Light']].map(([k,n])=>`<button data-b="${k}" class="${(localStorage.getItem('pkmn_ed_bg')||'check')===k?'on':''}">${n}</button>`).join('')}
          </div>
          <button class="btn" id="edReplay">▶ Replay animation</button>
        </div>
        <div class="ed-stage bg-${localStorage.getItem('pkmn_ed_bg')||'check'}" id="edStage">
          <iframe id="edFrame" src="overlay?preview=1&key=${ROOM}"></iframe>
        </div>
        <div class="muted" style="margin-top:8px">Preview shows a full 1920×1080 stream frame. Changes save automatically.</div>
      </div>
      <div class="box ed-ctrl">
        <h3>Layout</h3>
        <div class="fld two"><span>Prices pop</span>${seg('layout',[['under','Under'],['right','Right']])}</div>
        <div class="fld two"><span>Background</span>${seg('bg',[[false,'Off'],[true,'On']])}</div>
        <div class="fld two"><span>Position</span>${seg('pos',[['tl','↖ Top L'],['tr','↗ Top R'],['bl','↙ Bot L'],['br','↘ Bot R']])}</div>
        <h3>Font</h3>
        <div class="fld two"><span>Font</span>${seg('font',[['arial','Arial Black'],['impact','Impact'],['verdana','Verdana'],['poke','Pokémon titles'],['pokeall','Pokémon all']])}</div>
        <div class="fld two"><span>ALL CAPS titles</span>${seg('upper',[[true,'On'],[false,'Off']])}</div>
        ${SLIDERS.map(r=> r.length===1 ? `<h3>${r[0]}</h3>` :
          `<div class="fld"><span>${r[1]}</span><input type="range" data-s="${r[0]}" min="${r[2]}" max="${r[3]}" step="${r[4]}" value="${ST[r[0]]}"><span class="num" id="n_${r[0]}">${ST[r[0]]}${r[5]}</span></div>`).join('')}
        <h3>Colors</h3>
        <div class="fld two"><span>Text</span><input type="color" data-c="txt" value="${ST.txt}"></div>
        <div class="fld two"><span>Outline</span><input type="color" data-c="ink" value="${ST.ink}"></div>
        <div class="fld two"><span>Panel border</span><input type="color" data-c="border" value="${ST.border}"></div>
        <div class="fld two"><span>Panel fill</span><input type="color" data-c="panel" value="${ST.panel}"></div>
        <h3>Titles</h3>
        <div class="fld two"><span>Raw title</span><input type="text" data-t2="rawLabel" value="${esc(ST.rawLabel)}"></div>
        <div class="fld two"><span>PSA 10 title</span><input type="text" data-t2="psaLabel" value="${esc(ST.psaLabel)}"></div>
        <h3>Extras</h3>
        <div class="fld two"><span>Card shine</span>${seg('shine',[[true,'On'],[false,'Off']])}</div>
        <div class="fld two"><span>Count-up prices</span>${seg('countUp',[[true,'On'],[false,'Off']])}</div>
        <h3>Stream</h3>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0"><input type="checkbox" id="edLive" ${edLive?'checked':''}> Update the live overlay while I edit</label>
        <div class="row" style="margin-top:10px">
          <button class="btn gold" id="edPush" style="flex:1">Punch it to stream</button>
          <button class="btn" id="edReset">Reset</button>
        </div>
        <h3>Backup</h3>
        <div class="row"><button class="btn" id="edExport" style="flex:1">Export settings</button><button class="btn" id="edImport" style="flex:1">Import settings</button></div>
        <div class="muted" style="margin-top:6px;font-size:12px">Moves your key, look, saved PSA 10 prices and picks to another browser or site.</div>
        <div class="muted" style="margin-top:6px;font-size:12px">"Punch it" updates what's on stream now (if a card is showing). Otherwise the new look is used next time you show a card.</div>
      </div>`;
    edReady=false; edScale();
    edFrame().onload = ()=>{ edScale(); };
    v.querySelectorAll('.seg[data-k]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const k=g.dataset.k; let val=b.dataset.v; if(val==='true')val=true; else if(val==='false')val=false;
      ST[k]=val; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      // layout/bg/font switches look best replayed
      if(['layout','bg','font','countUp'].includes(k)){ saveS(); edPost('replay'); if(edLive&&visible) send(); } else changed();
    }));
    v.querySelectorAll('input[data-s]').forEach(r=>r.oninput=()=>{
      const k=r.dataset.s, row=SLIDERS.find(x=>x[0]===k); ST[k]=parseFloat(r.value); $('#n_'+k).textContent=r.value+row[5]; changed(); });
    v.querySelectorAll('input[data-c]').forEach(c=>c.oninput=()=>{ ST[c.dataset.c]=c.value; changed(); });
    v.querySelectorAll('input[data-t2]').forEach(t=>t.oninput=()=>{ ST[t.dataset.t2]=t.value||STYLE_DEFAULTS[t.dataset.t2]; changed(); });
    $('#edBg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ localStorage.setItem('pkmn_ed_bg',b.dataset.b);
      $('#edStage').className='ed-stage bg-'+b.dataset.b; $('#edBg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
    $('#edReplay').onclick=()=>edPost('replay');
    $('#edLive').onchange=e=>{ edLive=e.target.checked; localStorage.setItem('pkmn_ed_live', edLive?'1':'0'); };
    $('#edPush').onclick=()=>{ if(visible){ send(); toast('Punched to stream'); } else toast('Saved — show a card in Cards to put it on stream'); };
    $('#edExport').onclick=async()=>{
      const data={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('pkmn_')) data[k]=localStorage.getItem(k); }
      const code='OUTLAW1:'+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      try{ await navigator.clipboard.writeText(code); toast('Settings copied — paste them into Import on the other site'); }
      catch(_){ prompt('Copy this backup code:', code); }
    };
    $('#edImport').onclick=()=>{
      const code=(prompt('Paste your backup code (from Export settings):')||'').trim(); if(!code) return;
      try{ if(!code.startsWith('OUTLAW1:')) throw 0; const data=JSON.parse(decodeURIComponent(escape(atob(code.slice(8)))));
        Object.entries(data).forEach(([k,v])=>{ if(k.startsWith('pkmn_')) localStorage.setItem(k,v); });
        toast('Settings imported — reloading'); setTimeout(()=>location.href=location.href.split('?')[0], 700);
      }catch(_){ toast("That backup code didn't work — copy it again"); }
    };
    $('#edReset').onclick=()=>{ if(!confirm('Reset the overlay look to defaults?')) return; Object.keys(ST).forEach(k=>delete ST[k]); Object.assign(ST, STYLE_DEFAULTS); saveS(); buildEditor(); };
    edBuilt=true;
  }

  document.querySelectorAll('.tab[data-v]').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab[data-v]').forEach(x=>x.classList.toggle('on',x===t));
    const ed = t.dataset.v==='editor';
    $('#viewCards').style.display = ed?'none':''; $('#viewEditor').style.display = ed?'grid':'none';
    if(ed){ buildEditor(); requestAnimationFrame(edScale); }
  });

  renderPane();
}
</script>
</body>
</html>
